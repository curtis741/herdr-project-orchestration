id = "herdr-plugins.project-orchestration"
name = "Project Orchestration"
version = "0.11.0"
min_herdr_version = "0.7.5"
description = "Multi-agent project orchestration — coordinate workers, a librarian, a watcher, and a researcher across a group of tickets using the project CLI. Works with Jira, Linear, GitHub Issues, or any tracker."
platforms = ["linux", "macos"]

[[build]]
command = ["bash", "scripts/plugin-setup.sh"]

[[actions]]
id = "start"
title = "Start a project"
description = "Create a workspace, initialize the project, and register the orchestrator. Run: project start <name> [label]"
contexts = ["pane", "workspace"]
command = ["bash", "-c", "echo 'Usage: project start <project-name> [workspace-label]'; echo 'Run this directly in your terminal — plugin actions cannot pass arguments.'"]

[[actions]]
id = "status"
title = "Show project status"
description = "Show agent states for all registered roles in the current project."
contexts = ["pane", "workspace"]
command = ["bash", "-c", "project status"]

[[actions]]
id = "roster"
title = "Show project roster"
description = "Print the current role-to-pane-ID map for the project."
contexts = ["pane", "workspace"]
command = ["bash", "-c", "project roster"]
